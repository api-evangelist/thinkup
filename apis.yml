name: ThinkUp
description: ThinkUp was a social media analytics application, co-founded by Gina Trapani and
  Anil Dash, that gave individuals insights into their own activity across Twitter, Facebook,
  Instagram, and other social networks. Backed by Bloomberg Beta, it ran as both a hosted
  subscription service and an open-source project (ThinkUpLLC/ThinkUp on GitHub, 3.2k+ stars)
  before its hosted service was shut down in 2016. The thinkup.com domain is no longer
  operated by the company (it now resolves to an unrelated coupon-code site), and no public
  developer API surface is available for enrichment.
